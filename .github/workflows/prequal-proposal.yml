name: Prequalification proposal

# Runs the account-research agents on one account and commits a short,
# research-backed prequalification proposal to data/proposals/.
#
# Two ways to start it:
#   1. Queue a request: commit a JSON file to data/prequal/requests/ on any
#      branch (see data/prequal/README.md). The push starts this workflow on
#      that branch, and the proposal is committed back next to it.
#   2. Actions tab -> "Prequalification proposal" -> Run workflow (available
#      once this file is on the default branch).
#
# The agents read the ledger (data/master/contacts.json), fetch the account's
# own site from this runner, and research the open web through Claude's
# server-side web search and fetch tools. Everything lands in data/proposals/,
# where scripts/push_proposals_to_crm.py picks it up for the CRM on Monday.
#
# Commits made with GITHUB_TOKEN do not start new workflow runs, so marking a
# request done cannot re-trigger this workflow.

on:
  push:
    paths:
      - "data/prequal/requests/**"
  workflow_dispatch:
    inputs:
      account:
        description: "Company name"
        required: false
        type: string
      domain:
        description: "Company web domain, e.g. example.com"
        required: false
        type: string
      request_text:
        description: "The inbound request or LinkedIn message, verbatim (blank for a proactive note)"
        required: false
        type: string
      lead_source:
        description: "Where the lead came from"
        required: false
        default: linkedin
        type: choice
        options: [linkedin, referral, inbound, outbound, other]

permissions:
  contents: write

concurrency:
  group: prequal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proposal:
    name: Research and write the proposal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ACCOUNT_RESEARCH_MODEL_PROVIDER: anthropic
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check the Anthropic key is present
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Missing repository secret ANTHROPIC_API_KEY (Settings -> Secrets and variables -> Actions -> Secrets tab -> New repository secret)."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY present (${#ANTHROPIC_API_KEY} chars)."

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the agent runtime
        # Only what the anthropic provider needs: ADK and the Anthropic SDK.
        # The Vertex, BigQuery and tracing extras stay out of this job.
        run: pip install -q "google-adk>=1.31.0" "anthropic>=1.8" python-dotenv pytest

      - name: Test the agent tools
        run: python -m pytest python/agents/account-research/tests -q

      - name: Queue the dispatched request
        if: github.event_name == 'workflow_dispatch'
        # Inputs reach the script through the environment, never spliced into
        # the shell -- anyone who can dispatch could otherwise run code here.
        env:
          IN_ACCOUNT: ${{ inputs.account }}
          IN_DOMAIN: ${{ inputs.domain }}
          IN_REQUEST: ${{ inputs.request_text }}
          IN_SOURCE: ${{ inputs.lead_source }}
        run: |
          python - <<'PY'
          import json, os, re, datetime
          from pathlib import Path
          acct, dom = os.environ["IN_ACCOUNT"].strip(), os.environ["IN_DOMAIN"].strip()
          if not (acct or dom):
              raise SystemExit("::error::Give a company name or a domain.")
          today = datetime.date.today().isoformat()
          slug = re.sub(r"[^a-z0-9]+", "-", (acct or dom).lower()).strip("-")[:60]
          path = Path("data/prequal/requests") / f"{slug}-{today}.json"
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              "account": acct, "domain": dom,
              "request_text": os.environ["IN_REQUEST"],
              "lead_source": os.environ["IN_SOURCE"],
              "requested_at": today,
          }, indent=2) + "\n")
          print(f"queued {path}")
          PY

      - name: Run the agents on every pending request
        working-directory: python/agents/account-research
        run: python scripts/run_prequal.py --pending

      - name: Commit the proposals
        if: ${{ !cancelled() }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "prequal[bot]"
          git config user.email "prequal[bot]@users.noreply.github.com"
          git add data/proposals data/prequal/requests
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "prequal: proposal(s) $(date -u +%Y-%m-%d)"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Upload the proposals
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: prequal-proposals
          path: data/proposals/
          if-no-files-found: ignore
          retention-days: 30
