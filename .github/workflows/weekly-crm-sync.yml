name: Weekly CRM sync

# Two source pulls run as parallel jobs; the merge waits on both. A failure in
# one source does not block the other from staging, and the merge still runs
# with whatever staged successfully (it refuses only when *both* failed).

on:
  schedule:
    # Mondays 06:00 UTC. Apollo's weekly credit window resets on a rolling
    # basis, so the exact hour is a preference, not a constraint.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      apollo_list_id:
        description: "Restrict the Apollo pull to one list (label) id"
        required: false
        type: string
      explorium_roster:
        description: "master (parallel, default) or apollo (serial, enriches this week's pull)"
        required: false
        default: master
        type: choice
        options: [master, apollo]
      writeback:
        description: "Push master-resolved fields back to Apollo"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: crm-sync
  cancel-in-progress: false

jobs:
  preflight:
    name: Check secrets
    runs-on: ubuntu-latest
    # Fail here, in one place, with a message that says what to fix -- rather
    # than three jobs each dying on an empty env var. Secrets must be
    # *Repository* secrets: no job declares an `environment:`, so Environment
    # secrets are invisible to this workflow.
    env:
      APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
      EXPLORIUM_API_KEY: ${{ secrets.EXPLORIUM_API_KEY }}
    steps:
      - name: Verify repository secrets are present
        run: |
          missing=""
          [ -z "$APOLLO_API_KEY" ] && missing="$missing APOLLO_API_KEY"
          [ -z "$EXPLORIUM_API_KEY" ] && missing="$missing EXPLORIUM_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions -> Repository secrets."
            echo "Environment, Dependabot and Codespaces secrets are separate stores and will not work here."
            exit 1
          fi
          echo "Both secrets present (APOLLO_API_KEY: ${#APOLLO_API_KEY} chars, EXPLORIUM_API_KEY: ${#EXPLORIUM_API_KEY} chars)."

  pull-apollo:
    name: Pull Apollo contacts
    runs-on: ubuntu-latest
    needs: preflight
    env:
      APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pull
        run: |
          ARGS=""
          if [ -n "${{ inputs.apollo_list_id }}" ]; then
            ARGS="--list-id ${{ inputs.apollo_list_id }}"
          fi
          python scripts/pull_apollo.py $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: staging-apollo
          path: data/staging/apollo.json
          retention-days: 14

  pull-explorium:
    name: Enrich via Explorium
    runs-on: ubuntu-latest
    # Default mode: enriches the previous master, so it needs nothing from
    # pull-apollo and the two run side by side. Skipped in serial mode.
    needs: preflight
    if: ${{ inputs.explorium_roster != 'apollo' }}
    env:
      EXPLORIUM_API_KEY: ${{ secrets.EXPLORIUM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enrich
        run: python scripts/pull_explorium.py --roster master
      - uses: actions/upload-artifact@v4
        with:
          name: staging-explorium
          path: data/staging/explorium.json
          retention-days: 14

  pull-explorium-serial:
    name: Enrich via Explorium (serial, this week's Apollo pull)
    runs-on: ubuntu-latest
    # Opt-in via workflow_dispatch: waits for pull-apollo and enriches that
    # pull, so new contacts are enriched the same week at the cost of parallelism.
    needs: pull-apollo
    if: ${{ inputs.explorium_roster == 'apollo' }}
    env:
      EXPLORIUM_API_KEY: ${{ secrets.EXPLORIUM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: staging-apollo
          path: data/staging
      - name: Enrich
        run: python scripts/pull_explorium.py --roster apollo
      - uses: actions/upload-artifact@v4
        with:
          name: staging-explorium
          path: data/staging/explorium.json
          retention-days: 14

  merge:
    name: Merge into master
    runs-on: ubuntu-latest
    needs: [pull-apollo, pull-explorium, pull-explorium-serial]
    # Run even if one pull failed or was skipped; merge_master.py handles a
    # missing staging file and refuses only when nothing staged at all.
    if: ${{ !cancelled() && (needs.pull-apollo.result == 'success' || needs.pull-explorium.result == 'success' || needs.pull-explorium-serial.result == 'success') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: staging-*
          path: data/staging
          merge-multiple: true
      - name: Run tests
        run: pip install -q pytest && python -m pytest tests -q
      - name: Merge
        run: python scripts/merge_master.py
      - name: Commit master
        run: |
          git config user.name "crm-sync[bot]"
          git config user.email "crm-sync[bot]@users.noreply.github.com"
          git add data/master data/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to master this week."
          else
            git commit -m "chore(crm): weekly sync $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Upload master snapshot
        uses: actions/upload-artifact@v4
        with:
          name: master-contacts
          path: |
            data/master/contacts.json
            data/CHANGELOG.md
          retention-days: 90

  writeback:
    name: Push to Apollo
    runs-on: ubuntu-latest
    needs: merge
    if: ${{ inputs.writeback == true }}
    env:
      APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
      APOLLO_WRITEBACK_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - run: git pull --ff-only
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/push_apollo.py --apply
