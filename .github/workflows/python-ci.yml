name: Python CI

# Runs the merge test suite on every push and PR. The weekly sync's merge job
# runs the same two steps before it touches master; this makes them a check
# on every commit too.

on:
  push:
    branches: [ "claude/explorium-docs-mcp-brregp" ]
  pull_request:
    branches: [ "claude/explorium-docs-mcp-brregp" ]

# Least privilege, and explicit: without this the workflow inherits whatever
# the repository default happens to be. It only reads code and runs tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pytest pyyaml
      - run: python -m pytest tests -q
      - run: python -m pytest python/agents/account-research/tests -q

  # The architecture gate: architecture/invariants.yaml is the executable form
  # of the Notion ADRs. Fails on a regression (a MUST_NOT_REGRESS control
  # failing, a rule below its expected status, a schema error, stale Markdown),
  # never on an improvement. A required status check on the default branch.
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pytest pyyaml
      - run: python scripts/check_architecture.py --check-md
      - run: python -m pytest tests/test_check_architecture.py -q
