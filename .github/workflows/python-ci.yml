name: Python CI

# Runs the merge test suite on every push and PR. The weekly sync's merge job
# runs the same two steps before it touches master; this makes them a check
# on every commit too.

on:
  push:
    branches: [ "claude/explorium-docs-mcp-brregp" ]
  pull_request:
    branches: [ "claude/explorium-docs-mcp-brregp" ]
  # Data PRs opened by a workflow's GITHUB_TOKEN do not trigger pull_request;
  # scripts/open_data_pr.sh dispatches this on the data branch instead, so the
  # checks land on the PR's head commit. It passes that commit as
  # expected_sha, and each job fails unless it checked out exactly that commit.
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Fail unless the commit checked out is exactly this one"
        required: false
        type: string

# Least privilege, and explicit: without this the workflow inherits whatever
# the repository default happens to be. It only reads code and runs tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the commit is the one requested
        if: ${{ inputs.expected_sha }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$EXPECTED_SHA" ] || [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $actual (GITHUB_SHA $GITHUB_SHA), not the requested $EXPECTED_SHA; these checks do not describe that commit."
            exit 1
          fi
          echo "Checking exactly $EXPECTED_SHA."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pytest pyyaml
      - run: python -m pytest tests -q
      - run: python -m pytest python/agents/account-research/tests -q

  # The architecture gate. check_architecture: architecture/invariants.yaml is
  # the executable form of the ADRs; fails on a regression (a MUST_NOT_REGRESS
  # control failing, a rule below its expected status, a schema error, stale
  # Markdown), never on an improvement. validate_architecture: the manifest,
  # ADR files, system-of-record matrix, invariants and code agree, and the
  # protected digest is current and CODEOWNERS covers the enforcement paths
  # but no data path. The digest detects drift; it authenticates nobody.
  # Meant as a required status check on the default branch.
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the commit is the one requested
        if: ${{ inputs.expected_sha }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$EXPECTED_SHA" ] || [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $actual (GITHUB_SHA $GITHUB_SHA), not the requested $EXPECTED_SHA; these checks do not describe that commit."
            exit 1
          fi
          echo "Checking exactly $EXPECTED_SHA."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pytest pyyaml
      - run: python scripts/check_architecture.py --check-md
      - run: python scripts/validate_architecture.py
      - run: python -m pytest tests/test_check_architecture.py tests/test_validate_architecture.py -q
