# Architecture invariants: the machine-readable source.
#
# Notion governs architecture decisions (INTEGRATED GTM ARCHITECTURE, 02 —
# Architecture Decision Records). This file is their executable form: one
# implementation-independent rule per decision, with the probes that test
# how far today's system meets it. scripts/check_architecture.py runs the
# probes; docs/architecture-invariants.md is rendered from this file and
# checked against it in CI. ADRs are never copied here: `decisions` indexes
# them by Notion URL and status, as of the date given.
#
# Fields
#   decisions[]   id, title, url (Notion; null when not written), status, as_of
#   invariants[]  id, decision (row title), adr (decisions[].id), rule (no
#                 module or function names), expected (ENFORCED | PARTIAL |
#                 MISSING: the status CI holds the line at, with a CRM dump),
#                 requires_runtime (true: UNVERIFIED without --crm-dump),
#                 gaps (what stops ENFORCED), probes[]
#   probes[]      id, what, kind (static | unit | runtime), scope (core: counts
#                 toward the rule's status | guard: an adjacent control that
#                 must hold but does not by itself satisfy the rule), target
#                 (today's implementation; only here), must_not_regress
schema: 1

decisions:
  - id: ADR-006
    title: AI Action Contract
    url: https://app.notion.com/p/a749895b8af44375a86cba7edd7c298f
    status: Proposed
    as_of: 2026-10-02
  - id: ADR-012
    title: AI-Native Intelligence Core (target)
    url: https://app.notion.com/p/3ec7ecee36a9814aa01ffdf64313dfc6
    status: Proposed (draft in 14 — Governance Amendment; not yet filed in 02)
    as_of: 2026-10-02
  - id: ADR-013
    title: Learning and research optimisation (future)
    url: null
    status: Not written
    as_of: 2026-10-02

invariants:
  - id: INV-01
    decision: Signal is first-class
    adr: ADR-012
    rule: >-
      ∀ s ∈ Signal: s.id ∧ s.subject ∧ s.source ∧ s.observed_at ∧ s.kind ∈ SignalKinds,
      stored as a record of its own, never only as text inside another record
    expected: MISSING
    requires_runtime: false
    gaps: [no Signal record type or store; signals exist only as rows in proposal prose and vendor fields]
    probes:
      - {id: P-01a, what: a Signal record type with id, subject, source, observed_at and kind exists, kind: static, scope: core, target: crm.signal.Signal, must_not_regress: false}

  - id: INV-02
    decision: Observation is not interpretation
    adr: ADR-012
    rule: >-
      an Observation records only what a source reported (value, source, observed_at); stance and
      meaning attach only through Evidence(observation, hypothesis, stance)
    expected: PARTIAL
    requires_runtime: false
    gaps: [no Evidence link; stances exist only as prose tags in proposals]
    probes:
      - {id: P-02a, what: field-level provenance carries no interpretive field (source, observed_at, confidence only), kind: unit, scope: core, target: crm.schema.Provenance, must_not_regress: true}
      - {id: P-02b, what: an Evidence record linking an observation to a hypothesis with a stance exists, kind: static, scope: core, target: crm.evidence.Evidence, must_not_regress: false}

  - id: INV-03
    decision: Hypotheses are explicit
    adr: ADR-012
    rule: >-
      Hypothesis is versioned: an edit creates version v+1 with parent = v, and no version is ever
      overwritten or deleted
    expected: MISSING
    requires_runtime: false
    gaps: [no Hypothesis record; qualification reasoning lives in proposal prose]
    probes:
      - {id: P-03a, what: a Hypothesis record with version and parent exists, kind: static, scope: core, target: crm.hypothesis.Hypothesis, must_not_regress: false}

  - id: INV-04
    decision: Negative evidence counts
    adr: ADR-012
    rule: >-
      Evidence.stance ∈ {supports, contradicts}; contradicting input is kept, never silently
      discarded, and a hypothesis with unresolved contradicting evidence is never reported as supported
    expected: PARTIAL
    requires_runtime: false
    gaps: [no evidence edges or stance; contradictions are held only for field values and domains]
    probes:
      - {id: P-04a, what: a conflicting value of equal trust is held and reported, not overwritten, kind: unit, scope: core, target: crm.master.merge_all (conflicts_held), must_not_regress: true}
      - {id: P-04b, what: research citing a lookalike of the specified domain is refused, kind: unit, scope: core, target: crm.guardrails.check_run, must_not_regress: true}
      - {id: P-04c, what: Evidence carries a stance of supports or contradicts, kind: static, scope: core, target: crm.evidence.Evidence.stance, must_not_regress: false}

  - id: INV-05
    decision: Temporal intelligence
    adr: ADR-012
    rule: >-
      the state recorded at time t is an immutable snapshot: no write at t' > t alters what t recorded
    expected: PARTIAL
    requires_runtime: false
    gaps: [no StateSnapshot record; CRM documents change in place under version numbers]
    probes:
      - {id: P-05a, what: a filed run cannot be filed again, kind: unit, scope: core, target: scripts/compose_account.py finalize (run_final.json), must_not_regress: true}
      - {id: P-05b, what: a record's notes are only ever appended to, kind: unit, scope: core, target: scripts/compose_account.py plan_account_write, must_not_regress: true}
      - {id: P-05c, what: a StateSnapshot record exists, kind: static, scope: core, target: crm.snapshot.StateSnapshot, must_not_regress: false}

  - id: INV-06
    decision: Decisions are reproducible
    adr: ADR-006
    rule: >-
      Decision.id is unique and opaque; Decision.fingerprint = H(inputs, policy_version, model,
      prompt) is stored separately; equal fingerprints yield equal outcomes; the ledger is append-only
    expected: PARTIAL
    requires_runtime: false
    gaps: [the proposal id is deterministic but mixes identity with inputs; no separate fingerprint; run log status changes in place]
    probes:
      - {id: P-06a, what: the same inputs give the same proposal id, kind: unit, scope: core, target: scripts/compose_account.py proposal_record, must_not_regress: true}
      - {id: P-06b, what: decision records carry a fingerprint separate from their id, kind: static, scope: core, target: proposal record key "fingerprint", must_not_regress: false}

  - id: INV-07
    decision: Human in the loop is required
    adr: ADR-006
    rule: >-
      ∀ action a with risk(a) ≥ threshold(kind(a)): executed(a) ⇒ ∃ authorization(a) by a human
      that records the check performed and covers exactly a
    expected: PARTIAL
    requires_runtime: true
    gaps: [no general ActionAuthorization record or approval queue; only bulk creation, credit spend and HOLD clearance are gated]
    probes:
      - {id: P-07a, what: bulk creation over the threshold holds until that exact count is confirmed, kind: unit, scope: core, target: crm.runlog.held, must_not_regress: true}
      - {id: P-07b, what: credit spend needs an approved job and a passing budget; settling an unapproved job is refused, kind: unit, scope: core, target: crm.broker.approve / crm.broker.settle, must_not_regress: true}
      - {id: P-07c, what: a HOLD names the independent check that clears it, kind: unit, scope: core, target: crm.review.with_check, must_not_regress: true}
      - {id: P-07d, what: the CRM page's confirm requires a written note of the check, kind: static, scope: core, target: artifact/crm-system.html, must_not_regress: true}
      - {id: P-07e, what: every confirmed or applied held run records its check and confirmed_count equals created, kind: runtime, scope: core, target: CRM runlog collection, must_not_regress: true}
      - {id: P-07f, what: a general ActionAuthorization record exists, kind: static, scope: core, target: crm.authorization.ActionAuthorization, must_not_regress: false}

  - id: INV-08
    decision: Policies are enforced
    adr: ADR-006
    rule: >-
      every write is preceded by exactly one verdict ∈ {allow, hold, refuse} from a single policy
      gate, recorded with the policy version
    expected: PARTIAL
    requires_runtime: false
    gaps: [policies are enforced in several places; no single gate and no recorded verdict or policy version]
    probes:
      - {id: P-08a, what: research about a lookalike domain is refused, kind: unit, scope: core, target: crm.guardrails.check_run, must_not_regress: true}
      - {id: P-08b, what: when nothing is found on the specified domain the output must say so, kind: unit, scope: core, target: crm.guardrails.check_run, must_not_regress: true}
      - {id: P-08c, what: paid enrichment without the form's permission is refused, kind: unit, scope: core, target: crm.guardrails.check_run, must_not_regress: true}
      - {id: P-08d, what: a write touching a human-owned field is refused, kind: unit, scope: core, target: crm.crm_sync.assert_not_owned, must_not_regress: true}
      - {id: P-08e, what: a proposal naming a price is refused, kind: unit, scope: core, target: account_research.tools.write_proposal._MONEY, must_not_regress: true}
      - {id: P-08f, what: a single policy gate returning a recorded verdict exists, kind: static, scope: core, target: crm.policy.PolicyGate, must_not_regress: false}

  - id: INV-09
    decision: Agents cannot bypass gates
    adr: ADR-006
    rule: >-
      the executor refuses any action that does not carry a valid authorization id bound to that action
    expected: PARTIAL
    requires_runtime: false
    gaps: [CRM writes from sessions are not executor-gated; no authorization id]
    probes:
      - {id: P-09a, what: settling a job that was not approved raises, kind: unit, scope: core, target: crm.broker.settle, must_not_regress: true}
      - {id: P-09b, what: a merge that would create more than the threshold writes no master, kind: unit, scope: core, target: scripts/merge_master.py, must_not_regress: true}
      - {id: P-09c, what: an executor that requires an authorization id exists, kind: static, scope: core, target: crm.executor.execute, must_not_regress: false}

  - id: INV-10
    decision: Execution is verified
    adr: ADR-006
    rule: >-
      each action kind declares postconditions; after execution they are read back from the target
      and must hold, else the action is marked failed
    expected: PARTIAL
    requires_runtime: false
    gaps: [no declared postconditions; written fields are not read back]
    probes:
      - {id: P-10a, what: a write to a document of known version is pinned to that version, kind: unit, scope: core, target: crm.crm_sync.pinned, must_not_regress: true}
      - {id: P-10b, what: the data-layer validator fails on a duplicate identity, kind: unit, scope: core, target: scripts/validate_sync.py check_master, must_not_regress: true}
      - {id: P-10c, what: action kinds declare postconditions checked by read-back, kind: static, scope: core, target: crm.executor.POSTCONDITIONS, must_not_regress: false}

  - id: INV-11
    decision: Outcomes are captured
    adr: ADR-012
    rule: >-
      Outcome(action_ref, effect, observed_at) is append-only and every outcome references the action
      or decision it follows
    expected: PARTIAL
    requires_runtime: false
    gaps: [outcomes are recorded but not linked to an action or decision id]
    probes:
      - {id: P-11a, what: outcome kinds exist (replies, meetings; proposal accepted or declined), kind: static, scope: core, target: crm.activity.TYPES / crm.crm_sync.PROPOSAL_STATUSES, must_not_regress: true}
      - {id: P-11b, what: a captured outcome carries a reference to its action or decision, kind: static, scope: core, target: crm.activity.row action_ref, must_not_regress: false}

  - id: INV-12
    decision: Learning is measured
    adr: ADR-012
    rule: >-
      Evaluation(subject, metric, cohort, window, value, n, baseline) is computed from outcome records
      only, never typed in
    expected: PARTIAL
    requires_runtime: false
    gaps: [no Evaluation record, cohort or baseline; only a computed scorecard]
    probes:
      - {id: P-12a, what: the scorecard is computed from recorded activity, kind: unit, scope: core, target: crm.activity.scorecard, must_not_regress: true}
      - {id: P-12b, what: an Evaluation record with cohort, window, sample size and baseline exists, kind: static, scope: core, target: crm.evaluation.Evaluation, must_not_regress: false}

  - id: INV-13
    decision: Signal performance is learned
    adr: ADR-013
    rule: >-
      signal performance is computed per (signal kind, cohort, time window) with n ≥ n_min against a
      baseline by a scheduled job, and stored as Evaluation records
    expected: MISSING
    requires_runtime: false
    gaps: [no calibration job; depends on INV-01 and INV-12]
    probes:
      - {id: P-13a, what: a calibration job computing cohort and window aware signal performance exists, kind: static, scope: core, target: crm.calibration, must_not_regress: false}

  - id: INV-14
    decision: Research is optimized
    adr: ADR-013
    rule: >-
      the next research step maximises expected information gain per unit cost, within the authorized
      budget
    expected: MISSING
    requires_runtime: false
    gaps: [research follows a fixed cheapest-first order; no gain model]
    probes:
      - {id: P-14a, what: an information-gain planner exists, kind: static, scope: core, target: crm.research_planner, must_not_regress: false}
      - {id: P-14b, what: spending fails closed without a balance, a floor or an estimate, kind: unit, scope: guard, target: crm.broker.budget_check, must_not_regress: true}

  - id: INV-15
    decision: Provenance is preserved
    adr: ADR-012
    rule: >-
      every stored value has a path value → transform* → source, with observation time at the source
    expected: PARTIAL
    requires_runtime: true
    gaps: [no transformation edges; provenance names the source but not the steps between]
    probes:
      - {id: P-15a, what: every merged field records its source and observation time, kind: unit, scope: core, target: crm.master.merge_all (provenance), must_not_regress: true}
      - {id: P-15b, what: every CRM contact carries provenance and its master key, kind: runtime, scope: core, target: CRM contacts collection, must_not_regress: true}
      - {id: P-15c, what: transformation edges are recorded, kind: static, scope: core, target: crm.provenance.ProvenanceEdge, must_not_regress: false}

  - id: INV-16
    decision: Auditability
    adr: ADR-006
    rule: >-
      every decision, output and write carries {model, prompt_hash, policy_version, code_version}
    expected: PARTIAL
    requires_runtime: false
    gaps: [only the model is recorded, often as "session"; no prompt hash, policy version or code version]
    probes:
      - {id: P-16a, what: a proposal record carries the model that produced it, kind: unit, scope: core, target: scripts/compose_account.py proposal_record, must_not_regress: true}
      - {id: P-16b, what: records carry a prompt hash, policy version and code version, kind: unit, scope: core, target: proposal record keys, must_not_regress: false}
