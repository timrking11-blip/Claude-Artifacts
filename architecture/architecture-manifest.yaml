# Observed 2026-10-09 through the routines API (list_triggers / get_trigger). Read-only; no setting was changed.
# binding: fresh (a new session each firing) | session (bound to a long-lived session) | device (tied to the owner's computer)
routines:
  - {trigger: trig_01RYpi4CQGB2h3uG2DzVAXqJ, name: Weekly Apollo ⇄ CRM System two-way sync, schedule: "CRON_TZ=America/New_York 0 7 * * 1", model: claude-opus-5-5, binding: fresh, governed_writer: true, last_run: 2026-10-05}
  - {trigger: trig_01DVc9TXfwjgg8QFK7BaCXLY, name: Weekly enrichment → CRM push, schedule: "CRON_TZ=America/New_York 30 7 * * 1", model: session, binding: session, governed_writer: true, last_run: 2026-10-05}
  - {trigger: trig_012qYJ65sLwpVRXWWYrYkvP6, name: Monday Data Sync (shadow), schedule: "CRON_TZ=America/New_York 50 7 * * 1", model: session, binding: session, governed_writer: true, last_run: 2026-10-05}
  - {trigger: trig_01S5mVAox1FebVCRNhvxTw5y, name: Weekly GTM Command Center refresh, schedule: "CRON_TZ=America/New_York 0 8 * * 1", model: claude-opus-5-5, binding: fresh, governed_writer: true, last_run: 2026-10-05}
  - {trigger: trig_015HpyuPCC1fSmeYmmAPmuqv, name: CRM Systems Atlas refresh, schedule: "0 13 1,11,21 * *", model: claude-opus-5-5, binding: fresh, governed_writer: false, last_run: 2026-10-01}
  - {trigger: trig_01MnLHnJcvc58uidm7hgrv4p, name: Morning brief, schedule: "0 12 * * 1-5", model: claude-sonnet-5-5, binding: fresh, governed_writer: false, last_run: 2026-10-09}
  - {trigger: trig_01MCsLdgUtN71u559LmXiezX, name: Daily site check, schedule: "0 11 * * *", model: claude-opus-5, binding: fresh, governed_writer: false, last_run: 2026-10-09,
     note: "ADR-008 routes it to Sonnet; changing its model is the owner's action (K5), not applied"}
  - {trigger: trig_01W9A9anRnfQxBWhb2FxEoPF, name: Composition run (Intake page button), schedule: on demand, model: session, binding: session, governed_writer: true, last_run: null}

connectors:
  - {name: Anthropic models (sessions and routines), basis: plan_then_api_list, note: "plan-included usage, then usage credits at standard API rates"}
  - {name: Apollo, basis: plan_included_credits, note: lead and direct-dial credits reset monthly; enrich only on the intake tick}
  - {name: Vibe Prospecting, basis: credits, note: prepaid pack; nothing spent without a jobs/ row, a free estimate and the owner's go}
  - {name: Explorium REST, basis: free, note: match-only (D1 declined)}
  - {name: Crunchbase, basis: free, note: free data tokens}
  - {name: Gmail, basis: free}
  - {name: Google Calendar, basis: free}
  - {name: Google Drive, basis: free}
  - {name: Notion, basis: plan}
  - {name: GitHub, basis: free}
  - {name: PandaDoc, basis: plan, note: connector available, no flow}

cost_basis:
  as_of: 2026-10-09
  sources:
    - https://platform.claude.com/docs/en/about-claude/pricing
    - https://platform.claude.com/docs/en/about-claude/models/overview
    - https://claude.com/pricing
  kind: api_list_estimate
  note: >-
    USD per million tokens at Anthropic API list prices, read on as_of. These are estimates, not
    invoices: sessions and routines bill against the owner's plan first, and usage beyond it bills as
    usage credits "at standard API rates" (claude.com/pricing). Actual spend and receipts are not kept
    in this public repository.
  usd_per_mtok:
    claude-fable-5-1:  {input: 10.00, cache_write_5m: 12.50, cache_write_1h: 20.00, cache_read: 0.25, output: 50.00}
    claude-opus-5-5:   {input: 4.00,  cache_write_5m: 5.00,  cache_write_1h: 8.00,  cache_read: 0.20, output: 20.00}
    claude-opus-5:     {input: 5.00,  cache_write_5m: 6.25,  cache_write_1h: 10.00, cache_read: 0.50, output: 25.00}
    claude-sonnet-5-5: {input: 2.00,  cache_write_5m: 2.50,  cache_write_1h: 4.00,  cache_read: 0.10, output: 10.00}
    claude-haiku-5-5:  {input: 0.10,  cache_write_5m: 0.125, cache_write_1h: 0.20,  cache_read: 0.01, output: 0.50}
  legacy_models: [claude-opus-5]
  batch_discount: 0.5

controls:
  bulk_create_hold_over: 5           # crm.runlog.HOLD_OVER: a run creating more holds for an exact-count confirm
  min_confirm_check: 12              # crm.runlog.MIN_CHECK: the CRM page's shortest accepted check note
  # .github/CODEOWNERS must own these (enforcement code, tests, docs, artifact pages) and no data/ path.
  code_owned_paths: [architecture/, crm/, scripts/, .github/, .github/CODEOWNERS, .github/workflows/, tests/, docs/,
                     artifact/, python/agents/account-research/, CLAUDE.md, README.md]
  data_paths_not_code_owned: [data/master/, data/CHANGELOG.md, data/runlog/, data/runs/, data/proposals/]

composition:
  decision: ADR-008
  monthly_cap: 5
  month_timezone: America/New_York
  over_cap: hold
  counted_from: [data/runs/<run_id>/manifest.json run.composed_at, CRM runlog "Composition run" entries]

protected:
  sections: [authority, decisions, system-of-record.yaml]
