# Architecture manifest: the machine-readable index of architecture/.
#
# Sections: authority (ADR-007's transition), decisions (index of adr/),
# systems (ids used by system-of-record.yaml), capabilities (four facts kept
# apart: decision_status, implementation_state, deployment, evidence),
# routines and connectors (ADR-008 cost basis), cost_basis (dated prices),
# composition (the monthly soft cap), protected_digest.
#
# Ownership is not restated here: system-of-record.yaml is its one
# definition. scripts/validate_architecture.py checks this file against the
# ADR files, the matrix, architecture/invariants.yaml and the code.
